<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#283d77"/>
      <stop offset="48%" stop-color="#091d56"/>
      <stop offset="85%" stop-color="#050f2d"/>
      <stop offset="100%" stop-color="#030818"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="38%" r="58%">
