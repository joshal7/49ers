<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Stylized 49ers Scarlet-to-Crimson Base -->
    <linearGradient id="redBgBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CC0E24"/>
      <stop offset="48%" stop-color="#9E0008"/>
      <stop offset="85%" stop-color="#620005"/>
      <stop offset="100%" stop-color="#3A0003"/>
    </linearGradient>

    <!-- Warm Center-Top Scarlet Spotlight -->
    <radialGradient id="redSpotlight" cx="50%" cy="40%" r="56%" fx="50%" fy="35%">
      <stop offset="0%" stop-color="#FF243C" stop-opacity="0.58"/>
      <stop offset="52%" stop-color="#B8000C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3A0003" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Ambient Gold Warmth Under Crest -->
    <radialGradient id="goldAmbient" cx="50%" cy="44%" r="46%">
      <stop offset="0%" stop-color="#E5CF96" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#B3995D" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Corner Vignette for Seamless Depth -->
    <radialGradient id="crimsonVignette" cx="50%" cy="50%" r="72%">
      <stop offset="58%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#190002" stop-opacity="0.68"/>
    </radialGradient>

    <!-- Subtle Top Specular Glass Highlight -->
    <linearGradient id="glassSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 49ers Metallic Gold Ring Gradient -->
    <linearGradient id="ninersGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEC688"/>
      <stop offset="50%" stop-color="#B3995D"/>
      <stop offset="100%" stop-color="#967C42"/>
    </linearGradient>

    <!-- Horizontal Metallic Gold Accent Rule Gradient -->
    <linearGradient id="goldRuleLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B3995D" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E5CF96" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="goldRuleRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E5CF96" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#B3995D" stop-opacity="0"/>
    </linearGradient>

    <!-- 49ers Inner Oval Scarlet Gradient -->
    <linearGradient id="ninersOvalRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B80000"/>
      <stop offset="55%" stop-color="#AA0000"/>
      <stop offset="100%" stop-color="#920000"/>
    </linearGradient>

    <!-- Studio Drop Shadow for 49ers Crest -->
    <filter id="crestShadow" x="-18%" y="-18%" width="136%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#140002" flood-opacity="0.72"/>
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.48"/>
    </filter>

    <!-- Soft Shadow for JOSHAL Wordmark -->
    <filter id="wordmarkShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#140002" flood-opacity="0.68"/>
    </filter>

    <clipPath id="iconClip">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <!-- 1. Stylized Red Background Layers -->
    <rect width="512" height="512" fill="url(#redBgBase)"/>
    <rect width="512" height="512" fill="url(#redSpotlight)"/>
    <rect width="512" height="512" fill="url(#goldAmbient)"/>

    <!-- Subtle Modern Diagonal Stadium Lighting Texture -->
    <g stroke="#FFFFFF" stroke-opacity="0.028" stroke-width="1.5">
      <line x1="-60" y1="130" x2="210" y2="-40"/>
      <line x1="-60" y1="215" x2="345" y2="-40"/>
      <line x1="-60" y1="300" x2="480" y2="-40"/>
      <line x1="-40" y1="385" x2="572" y2="0"/>
      <line x1="50" y1="540" x2="572" y2="210"/>
      <line x1="185" y1="545" x2="572" y2="300"/>
      <line x1="320" y1="550" x2="572" y2="390"/>
    </g>

    <!-- Top Glass Specular Arc -->
    <ellipse cx="256" cy="-28" rx="340" ry="175" fill="url(#glassSheen)"/>

    <!-- Deep Crimson Edge Vignette -->
    <rect width="512" height="512" fill="url(#crimsonVignette)"/>

    <!-- 2. Official San Francisco 49ers Logo (Wikimedia Vector Geometry) -->
    <g transform="translate(56, 94) scale(0.869565)" filter="url(#crestShadow)">
      <ellipse cx="230" cy="136" rx="230" ry="136" fill="#FFFFFF"/>
      <ellipse cx="229.5" cy="137" rx="223" ry="130" fill="#000000"/>
      <ellipse cx="230.5" cy="138.5" rx="194.5" ry="120" fill="url(#ninersGold)"/>
      <ellipse cx="231" cy="136.5" rx="179" ry="112" fill="url(#ninersOvalRed)"/>
      <path fill="#000000" d="M370.848,121.879h-0.492v-4.074h-3.578h-67.422c-1.523-7.99-6.121-15.4-12.676-21.186c-6.457-7.426-15.844-13.01-26.523-15.131l-4.43-0.91c-10.25-2.154-18.34-3.859-50.906-3.695c0,0-6.266-0.215-12.344-1.02c-1.539-0.389-2.891-0.855-4.051-1.355c0.449-2.709,5.41-6.443,11-7.168c0.582-0.105,35.824-6.59,72.102,16.904l0.891,0.574h23.84V48.334h-4.078v-4.076h-32.719c0,0-3.887,2.967-5.512,4.211c-9.418-2.359-55.559-12.455-95.395,4.984c-16.742,6.92-27.133,19.98-26.398,33.24c0.375,6.686,3.578,12.516,9.109,17.041c4.07,5.08,10.469,9.045,18.805,11.445c11.797,3.398,21.781,4.799,31.465,5.354v1.17v15.465h4.082v4.076h12.438c5.152,0,6.477,2.855,6.793,3.918c-15.875-1.039-40.023-5.559-57.793-22.008l-0.668-0.721h-0.125c-0.98-0.936-1.945-1.904-2.887-2.92l-1.063-1.154h-17.895v51.936h4.078v4.07h14.59c2.141,0.148,8.922-0.609,13.602-14.273c7.59,2.641,26.293,8.273,49.328,8.898v32.309c-0.805,10.848-24.703,14.246-33.031,14.574l-3.438,0.133v16.063h4.074v4.07h104.926v-15.367l-2.676-0.711c-0.48-0.121-0.934-0.246-1.398-0.375v-3.516l-3.277-0.281c-5.898-0.523-10.438-1.547-13.961-2.797c-6.594-3.703-7.723-6.703-7.863-7.188v-17.227h30.754c3.246,0.492,6.027,1.914,8.387,3.766c4.43,5.453,6.445,11.688,6.48,11.789l0.785,2.523l2.641,0.016h0.082c0.367,0.922,0.563,1.508,0.566,1.539l0.785,2.531h2.641h13.883v-62.488h-3.582h-0.492v-4.082h-3.59h-12.859l-0.594,2.863c-4.313,20.762-28.32,20.457-49.668,17.344c4.18-1.137,8.387-2.512,12.582-4.18c11.43-4.543,20.004-10.723,25.355-17.957h46.082c3.215,0.102,5.945,0.902,8.242,2.406c4.836,7.094,4.348,17.523,4.344,17.648l-0.199,3.777h3.781h0.508c-0.004,0.168-0.008,0.277-0.008,0.293l-0.207,3.781l3.789,0.008h14.578v-48.377H370.848z"/>
      <path fill="#FFFFFF" d="M297.34,134.674h38.195c21.816,0.695,20.238,27.914,20.238,27.914h11v-41.199h-65.922C300.852,121.389,300.695,130.609,297.34,134.674"/>
      <path fill="#FFFFFF" d="M219.598,169.861v31.637c-1.133,16.582-36.465,17.957-36.465,17.957v9.027h97.754v-9.027c-29.051-2.512-29.18-17.316-29.18-17.316v-21.125h34.723c15.883,2.266,21.988,22.168,21.988,22.168h10.293v-55.32h-9.945c-6.914,33.324-57.98,18.332-61.758,19.168C247.008,167.029,234.43,170.17,219.598,169.861"/>
      <path fill="#FFFFFF" d="M250.098,115.434c13.27,3.889,14.504,14.014,6.734,23.494c-9.941,9.383-25.125,9.77-25.125,9.77s-51.125,5.527-80.961-26.75h-12.738v44.762h11.164c0,0,6.805,1.043,11.168-15.359c0,0,52.496,21.363,102.43,1.539c48.363-19.211,29.957-61.287-3.32-67.881c-12.797-2.535-17.887-4.725-54.613-4.535c0,0-6.629-0.211-13.086-1.086c-20.242-5.059-8.73-18.145,3.141-19.68c0,0,36.469-7.189,74.512,17.451h19.195V47.842h-27.926l-5.93,4.535c0,0-51.766-14.455-94.75,4.361c-28.891,11.945-34.555,41.824-3,50.92c27.789,8.01,45.504,4.654,73.664,5.729C238.527,113.688,245.367,113.998,250.098,115.434"/>
      <path fill="#FFFFFF" d="M208.387,133.582h-13.266v-11.879c10.281,0,31.25,0.084,46.086,0c14.93,0,16.918,8.629,10.629,14.465c-5.93,5.502-18.352,9.42-33.055,6.744C218.781,142.912,217.57,133.582,208.387,133.582"/>
    </g>

    <!-- 3. "JOSHAL" in Small 49ers Bracketed Serif Style Below (Matching SF Monogram 3D Extrusion) -->
    <g filter="url(#wordmarkShadow)">
      <!-- Subtle Tapered Metallic Gold Flanking Lines (symmetrically spaced) -->
      <rect x="62" y="388.5" width="58" height="2" rx="1" fill="url(#goldRuleLeft)"/>
      <rect x="392" y="388.5" width="58" height="2" rx="1" fill="url(#goldRuleRight)"/>
      <circle cx="127" cy="389.5" r="2.2" fill="#E5CF96" opacity="0.88"/>
      <circle cx="385" cy="389.5" r="2.2" fill="#E5CF96" opacity="0.88"/>

      <!-- Wide Athletic Horizontal Scale to Match "SF" Proportions, optically centered -->
      <g transform="translate(256.5, 402) scale(1.15, 1)">
        <!-- 3D Black Block Extrusion (matches SF drop shadow angle) -->
        <text x="3.2" y="3.5" text-anchor="middle" font-family="Georgia, 'Charter', 'Times New Roman', serif" font-weight="900" font-size="37" letter-spacing="5" fill="#000000" stroke="#000000" stroke-width="3.2" stroke-linejoin="miter">JOSHAL</text>
        <text x="1.6" y="1.8" text-anchor="middle" font-family="Georgia, 'Charter', 'Times New Roman', serif" font-weight="900" font-size="37" letter-spacing="5" fill="#000000" stroke="#000000" stroke-width="3.2" stroke-linejoin="miter">JOSHAL</text>
        <!-- Crisp Black Outline + Pure White Face -->
        <text x="0" y="0" text-anchor="middle" font-family="Georgia, 'Charter', 'Times New Roman', serif" font-weight="900" font-size="37" letter-spacing="5" fill="#FFFFFF" stroke="#000000" stroke-width="2.8" stroke-linejoin="miter" paint-order="stroke fill">JOSHAL</text>
      </g>
    </g>
  </g>
</svg>