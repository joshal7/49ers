<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>49ers Faithful — 49ers.joshal.com</title>
  <meta name="description" content="High-signal San Francisco 49ers facts, All-22 film synthesis, player spider charts, CBA cap simulator, injury play-probability models, Monte Carlo playoff odds, and Autopodcast Studio." />

  <!-- iPhone 16 Safari Home Screen Shortcut & Chrome Mobile PWA Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="49ers HQ" />
  <meta name="theme-color" content="#0B0D10" id="metaThemeColor" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./assets/app-icon.svg?v=6" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=6" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=6" />
  <link rel="apple-touch-icon" sizes="512x512" href="./apple-touch-icon.png?v=6" />

<body>
  <!-- Full-Bleed Sticky Glass Header -->
  <header class="top-header" role="banner">
    <div class="header-row">
      <div class="brand-lockup" id="brandHomeTrigger" style="cursor:pointer" title="Return to Dashboard">
        <div class="brand-medallion-wrap">
          <img src="./assets/app-icon.svg?v=6" alt="49ers Faithful" class="brand-medallion" width="36" height="36" />
        </div>
        <div class="brand-titles">
          <h1 class="brand-name">
            <span>49ers Faithful</span>
            <span class="record-pill mono" id="headerRecordPill">—</span>
          </h1>
          <div class="brand-sub">
            <span class="live-pulse-dot" aria-hidden="true"></span>
            <span id="headerSubStatus">Syncing live feed…</span>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" id="openArchiveBtn" class="icon-btn" aria-label="Open Off-Cycle Archive">
          <svg class="ui-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="5" rx="1.5" fill="currentColor" fill-opacity="0.18"/>
            <rect x="3" y="4" width="18" height="5" rx="1.5"/>
            <path d="M4.5 9V18.5C4.5 19.6 5.4 20.5 6.5 20.5H17.5C18.6 20.5 19.5 19.6 19.5 18.5V9"/>
            <line x1="10" y1="13.5" x2="14" y2="13.5"/>
          </svg>
          <span>Archive</span>
        </button>
        <button type="button" id="openSettingsBtn" class="icon-btn" aria-label="Settings & Source Filters" title="Settings & Reporter Filters">
          <svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" y1="6" x2="10" y2="6"/>
            <line x1="14" y1="6" x2="20" y2="6"/>
            <circle cx="12" cy="6" r="2.2" fill="currentColor" fill-opacity="0.25"/>
            <circle cx="12" cy="6" r="2.2"/>
            <line x1="4" y1="12" x2="6" y2="12"/>
            <line x1="10" y1="12" x2="20" y2="12"/>
            <circle cx="8" cy="12" r="2.2" fill="currentColor" fill-opacity="0.25"/>
            <circle cx="8" cy="12" r="2.2"/>
            <line x1="4" y1="18" x2="14" y2="18"/>
            <line x1="18" y1="18" x2="20" y2="18"/>
            <circle cx="16" cy="18" r="2.2" fill="currentColor" fill-opacity="0.25"/>
            <circle cx="16" cy="18" r="2.2"/>
          </svg>
          <span class="header-btn-label">Tune</span>
        </button>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <!-- Dynamic Season Phase Banner (Shown only in Game & Season -> Trade Window) -->
    <section id="phaseBanner" class="phase-banner" hidden aria-label="Active NFL Season Phase"></section>

    <!-- Primary Dynamic View Container -->
    <main id="mainView" class="main-view" role="main" aria-live="polite">
      <div class="card">
        <div class="card-eyebrow">Loading 2026 Ledger</div>
        <h2 class="card-title">Initializing 49ers Faithful Intelligence…</h2>
      </div>
    </main>
  </div>

  <!-- Sticky Podcast Mini-Player (Docked above Bottom Nav when active) -->
  <aside id="miniPlayer" class="mini-player" hidden aria-label="Autopodcast Mini Player">
    <div class="mini-player-inner">
      <div class="mini-player-info" id="miniPlayerExpandTrigger">
        <div class="mini-player-title-row">
          <span class="mini-player-wave" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <div class="mini-player-title" id="miniPlayerTitle">—</div>
        </div>
        <div class="mini-player-time mono" id="miniPlayerTime">0:00 / 0:00</div>
      </div>
      <div class="mini-player-controls">
        <button type="button" class="mp-btn mono" id="mpBack15Btn" aria-label="Rewind 15 seconds">-15s</button>
        <button type="button" class="mp-btn play" id="mpPlayPauseBtn" aria-label="Play or Pause">
          <svg class="ui-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="6.5 4.5 19 12 6.5 19.5 6.5 4.5"/>
          </svg>
        </button>
        <button type="button" class="mp-btn mono" id="mpFwd30Btn" aria-label="Forward 30 seconds">+30s</button>
        <button type="button" class="mp-btn mono" id="mpSpeedBtn" aria-label="Playback Speed">1x</button>
        <button type="button" class="mp-btn" id="mpCloseBtn" aria-label="Close Mini Player">
          <svg class="ui-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Sticky 5-Tab Bottom Navigation Dock -->
  <nav class="bottom-nav" role="navigation" aria-label="Primary Sections">
    <div class="bottom-nav-inner">
      <button type="button" class="nav-tab-btn active" data-nav-tab="home">
        <span class="nav-icon" aria-hidden="true">
          <svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="8" height="10" rx="2.2" fill="currentColor" fill-opacity="0.18"/>
            <rect x="3" y="3" width="8" height="10" rx="2.2"/>
            <rect x="13" y="3" width="8" height="6" rx="2"/>
            <rect x="13" y="11" width="8" height="10" rx="2.2" fill="currentColor" fill-opacity="0.12"/>
            <rect x="13" y="11" width="8" height="10" rx="2.2"/>
            <rect x="3" y="15" width="8" height="6" rx="2"/>
          </svg>
        </span>
        <span class="nav-label">Home</span>
      </button>
      <button type="button" class="nav-tab-btn" data-nav-tab="news">
        <span class="nav-icon" aria-hidden="true">
          <svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2.5" fill="currentColor" fill-opacity="0.12"/>
            <rect x="3" y="4" width="18" height="16" rx="2.5"/>
            <polygon points="9.5 8.5 15 11.5 9.5 14.5" fill="currentColor" fill-opacity="0.28"/>
            <polygon points="9.5 8.5 15 11.5 9.5 14.5"/>
            <line x1="7" y1="17" x2="17" y2="17"/>
          </svg>
        </span>
        <span class="nav-label">News &amp; Film</span>
      </button>
      <button type="button" class="nav-tab-btn" data-nav-tab="season">
        <span class="nav-icon" aria-hidden="true">
          <svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="13" width="4" height="7.5" rx="1.2" fill="currentColor" fill-opacity="0.16"/>
            <rect x="3.5" y="13" width="4" height="7.5" rx="1.2"/>
            <rect x="10" y="9" width="4" height="11.5" rx="1.2" fill="currentColor" fill-opacity="0.16"/>
            <rect x="10" y="9" width="4" height="11.5" rx="1.2"/>
            <rect x="16.5" y="4.5" width="4" height="16" rx="1.2" fill="currentColor" fill-opacity="0.24"/>
            <rect x="16.5" y="4.5" width="4" height="16" rx="1.2"/>
            <path d="M4 9.5L9.5 5.5L13.5 7.5L19.5 2.5"/>
          </svg>
        </span>
        <span class="nav-label">Game &amp; Season</span>
      </button>
      <button type="button" class="nav-tab-btn" data-nav-tab="roster">
        <span class="nav-icon" aria-hidden="true">
          <svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.8 5.2C14.8 1.2 8.2 2.2 4.7 5.7C1.2 9.2 0.2 15.8 4.2 19.8C8.2 23.8 14.8 22.8 18.3 19.3C21.8 15.8 22.8 9.2 18.8 5.2Z" fill="currentColor" fill-opacity="0.15"/>
            <path d="M18.8 5.2C14.8 1.2 8.2 2.2 4.7 5.7C1.2 9.2 0.2 15.8 4.2 19.8C8.2 23.8 14.8 22.8 18.3 19.3C21.8 15.8 22.8 9.2 18.8 5.2Z"/>
            <line x1="8.5" y1="15.5" x2="15.5" y2="8.5"/>
            <line x1="9.2" y1="11.8" x2="12.2" y2="14.8"/>
            <line x1="11.8" y1="9.2" x2="14.8" y2="12.2"/>
            <path d="M5.5 12.5L11.5 18.5"/>
            <path d="M12.5 5.5L18.5 11.5"/>
          </svg>
        </span>
        <span class="nav-label">Roster &amp; Cap</span>
      </button>
      <button type="button" class="nav-tab-btn" data-nav-tab="audio">
        <span class="nav-icon" aria-hidden="true">
          <svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 13V11C4 6.58 7.58 3 12 3C16.42 3 20 6.58 20 11V13"/>
            <rect x="2.5" y="13" width="4" height="7" rx="1.8" fill="currentColor" fill-opacity="0.2"/>
            <rect x="2.5" y="13" width="4" height="7" rx="1.8"/>
            <rect x="17.5" y="13" width="4" height="7" rx="1.8" fill="currentColor" fill-opacity="0.2"/>
            <rect x="17.5" y="13" width="4" height="7" rx="1.8"/>
            <line x1="9.5" y1="11.5" x2="9.5" y2="16.5"/>
            <line x1="12" y1="9" x2="12" y2="18"/>
            <line x1="14.5" y1="12" x2="14.5" y2="16"/>
          </svg>
        </span>
        <span class="nav-label">Audio &amp; AI</span>
      </button>
    </div>
  </nav>

  <!-- Universal Slide-Up Bottom Sheet (Player Dossier / Settings / Archive Vault / Podcast Transcript) -->
  <div id="bottomSheetBackdrop" class="sheet-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="bottom-sheet" id="bottomSheetContainer">
      <div class="sheet-drag-handle" aria-hidden="true"></div>
      <div class="sheet-header">
        <div style="min-width:0">
          <div class="card-eyebrow" id="sheetEyebrow">49ers Dossier</div>
          <h2 class="card-title" id="sheetTitle" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Details</h2>
        </div>
        <button type="button" id="closeSheetBtn" data-action="close-sheet" class="icon-btn" aria-label="Close Sheet">
          <svg class="ui-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
          <span>Close</span>
        </button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <!-- Subtle Quick-Bubble Popover for Football, Analytics & CBA Jargon -->
  <div id="jargonPopover" class="jargon-popover" hidden role="dialog" aria-label="Football &amp; Salary Cap Term Definition"></div>

  <script type="module" src="./src/app.js?v=24"></script>
</body>
</html>
