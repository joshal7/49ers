# Cloudflare Pages Config for Canary Multi-Tenant Sites (`lions.joshal.com` & `bills.joshal.com`)
#
# OPTION 1 — ZERO GODADDY NAMESERVER CHANGE:
# - Keeps `joshal.com` DNS 100% on GoDaddy (`www.joshal.com` SmugMug, `joshal.com`,
#   `whisky.joshal.com`, `whiskey.joshal.com`, `email`/MX, `49ers.joshal.com`, `workouts.joshal.com` untouched).
# - Connects `lions.joshal.com` & `bills.joshal.com` via 2 plain GoDaddy CNAME records
#   pointing to `nfl-hq-canary.pages.dev` (Free plan supports up to 100 custom subdomains).
# - Isolated inside `worker/pages-canary/wrangler.toml` so `worker/wrangler.toml` (`49ers-worker`) is untouched.

name = "nfl-hq-canary"
pages_build_output_dir = "../../dist-canary"
compatibility_date = "2026-11-01"

[[kv_namespaces]]
binding = "SHARED_CACHE"
id = "REPLACE_WITH_NFL_SHARED_CACHE_KV_ID"

[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "nfl-data-public"

[vars]
CANARY_TEAMS = "DET,BUF"
GEMINI_DEFAULT_FREE_MODEL = "gemini-4-hydrogen"
GEMINI_THINKING_LEVEL = "XHIGH"
