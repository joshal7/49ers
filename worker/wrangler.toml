name = "49ers-worker"
main = "index.js"
compatibility_date = "2026-11-01"

# 100% Free-Tier Cloudflare Bindings:
# 1. KV Namespace for shared friend-group caching of Deep Analyses, Episode metadata & Auto-Upgraded Model state
[[kv_namespaces]]
binding = "SHARED_CACHE"
id = "REPLACE_WITH_YOUR_FREE_KV_NAMESPACE_ID"

# 2. R2 Bucket (10 GB free storage, $0 egress) for cached multi-speaker Autopodcast audio files
[[r2_buckets]]
binding = "PODCAST_BUCKET"
bucket_name = "49ers-autopodcasts"

# 3. Periodic Free-Model Auto-Discovery Cron (every 6 hours, polls /v1beta/models for newer free Gemini Flash/Pro tiers)
[triggers]
crons = ["15 */6 * * *"]

[vars]
ALLOWED_ORIGIN = "https://49ers.joshal.com"
GEMINI_TEXT_MODEL = "auto"
GEMINI_DEFAULT_FREE_MODEL = "gemini-4-hydrogen"
GEMINI_THINKING_LEVEL = "XHIGH"
GEMINI_THINKING_BUDGET = "24576"
# "auto" cascades highest-quality Studio Pro TTS (gemini-2.5-pro-preview-tts -> gemini-2.5-flash-preview-tts)
GEMINI_AUDIO_MODEL = "auto"

# Secrets configured via `npx wrangler secret put <NAME>`:
# - GROUP_PASSCODE: Shared passcode for Josh & ~24 friends
# - GEMINI_API_KEY: Free-tier Google AI Studio API key
