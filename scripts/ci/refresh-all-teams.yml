# Reference workflow template (kept under scripts/ci/ so PAT without `workflow` scope can push cleanly).
# Copy to .github/workflows/refresh-all-teams.yml via GitHub UI or PAT with `workflow` scope.
name: Refresh All 32 NFL Teams & Deploy Cloudflare Pages

on:
  schedule:
    # Twice daily full 32-team refresh (5:05 PM PT / 01:05 UTC + morning 15:05 UTC)
    - cron: '5 1,15 * * *'
  workflow_dispatch:

concurrency:
  group: nfl-teams-refresh
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Unified 32-Team Live Data & Synchronized Seasonal Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_NFL_API_KEY }}
          GEMINI_NFL_API_KEY: ${{ secrets.GEMINI_NFL_API_KEY }}
          GEMINI_NEWS_API_KEY: ${{ secrets.GEMINI_NEWS_API_KEY }}
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          GROUP_PASSCODE: ${{ secrets.GROUP_PASSCODE }}
          GEMINI_SYNTHESIS_MODEL: auto
        run: node scripts/refresh-all-nfl-teams.mjs --concurrency=4

      - name: Build dist-nfl-teams/ Pages bundle (All 32 Teams + nfl.joshal.com)
        run: node scripts/build-nfl-teams-pages.mjs

      - name: Deploy all 32 teams to Cloudflare Pages (nfl-teams)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker/pages-nfl-teams
        run: npx --yes wrangler@4 pages deploy ../../dist-nfl-teams --project-name=nfl-teams --branch=main --commit-dirty=true

      - name: Deploy unified NFL Hub to Cloudflare Pages (nfl-joshal)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker/pages-nfl-joshal
        run: npx --yes wrangler@4 pages deploy ../../dist-nfl-teams --project-name=nfl-joshal --branch=main --commit-dirty=true
