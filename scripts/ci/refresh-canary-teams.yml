name: Refresh Canary NFL Teams (Lions One Pride & Bills Mafia -> R2)

# Strictly isolated canary workflow for `lions.joshal.com` and `bills.joshal.com`.
# NEVER modifies `main` or `49ers.joshal.com`.
# Uses dedicated `GEMINI_NFL_API_KEY` (`joshalbox@gmail.com`) -> 0 tokens from `joshal7@gmail.com`.

on:
  schedule:
    # Every 30 minutes across active NFL news, practice & game windows (15:00-06:59 UTC)
    - cron: '7,37 15-23,0-6 * * *'
    # Explicit 5:05 PM ET daily brief trigger (21:05 EDT / 22:05 EST)
    - cron: '5 21,22 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-canary-nfl-teams
  cancel-in-progress: false

jobs:
  refresh-canary-teams:
    name: Fetch Live Lions (DET) & Bills (BUF) Feeds & Upload to R2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout multi-team-canary branch
        uses: actions/checkout@v4
        with:
          ref: multi-team-canary
          fetch-depth: 2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Two-Stage Live Ingestion (Stage 1 League Once + Stage 2 DET & BUF)
        env:
          GEMINI_NFL_API_KEY: ${{ secrets.GEMINI_NFL_API_KEY }}
        run: node scripts/fetch-team-data.mjs --teams=DET,BUF

      - name: Validate Canary Team Data Integrity
        run: node tests/canary-teams-qa.mjs

      - name: Upload Live Canary JSON Feeds Directly to Cloudflare R2 (Zero Git Bloat)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: nfl-data-public
        run: node scripts/upload-r2-data.mjs --teams=lions,bills
