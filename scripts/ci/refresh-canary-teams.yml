name: Refresh Canary NFL Teams (Lions One Pride & Bills Mafia -> Cloudflare Pages Free)

# Isolated on `multi-team-canary` branch — NEVER touches `49ers.joshal.com`, `main`, or `data/*.json`.
# 100% Card-Free ($0): Refreshes DET & BUF JSON every 2 hours (~360 deploys/mo < 500/mo Pages Free cap)
# and deploys straight to Cloudflare Pages with ZERO Git history commits.

on:
  schedule:
    - cron: '12 */2 * * *'
  workflow_dispatch:
    inputs:
      teams:
        description: 'Comma-separated canary team abbrs/slugs (default DET,BUF)'
        required: false
        default: 'DET,BUF'

concurrency:
  group: refresh-canary-nfl-teams
  cancel-in-progress: false

jobs:
  refresh-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout multi-team-canary branch
        uses: actions/checkout@v4
        with:
          ref: multi-team-canary

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live 2026 data for Lions One Pride & Bills Mafia (Stage 1 + Stage 2)
        env:
          GEMINI_NFL_API_KEY: ${{ secrets.GEMINI_NFL_API_KEY }}
        run: |
          TEAMS="${{ github.event.inputs.teams || 'DET,BUF' }}"
          node scripts/fetch-team-data.mjs --teams="${TEAMS}"

      - name: Run Canary Data & Isolation QA Guard
        run: node tests/canary-teams-qa.mjs

      - name: Build & Deploy Cloudflare Pages Bundle (Card-Free, Zero Git Commits)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/build-canary-pages.mjs
          cd worker/pages-canary
          npx --yes wrangler@4 pages deploy ../../dist-canary --project-name=nfl-hq-canary --branch=multi-team-canary --commit-dirty=true
